name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
    - name: Generate local.properties
      run: 'cat > local.properties <<EOF

        sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}

        admob.app.id=${{ secrets.ADMOB_APP_ID }}

        admob.banner.id=${{ secrets.ADMOB_BANNER_ID }}

        admob.interstitial.id=${{ secrets.ADMOB_INTERSTITIAL_ID }}

        EOF

        '
    - name: Decode signing keystore
      env:
        SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      run: "echo \"$SIGNING_KEY_BASE64\" | base64 --decode > \"$RUNNER_TEMP/release.jks\"\nif [ ! -s \"$RUNNER_TEMP/release.jks\" ]; then\n  echo \"::error::Decoded keystore is empty. Check SIGNING_KEY_BASE64 secret.\"\n  exit 1\nfi\n"
    - name: Compute version
      id: version
      run: "# versionCode must strictly increase on every run, INCLUDING re-runs of\n# the same workflow run. github.run_number stays the same on rerun, so\n# we combine it with github.run_attempt: code = run_number*100 + attempt.\n# This keeps codes monotonically increasing while leaving plenty of\n# headroom (up to 99 attempts per run before the next push overruns).\nRUN_NUMBER=${{ github.run_number }}\nRUN_ATTEMPT=${{ github.run_attempt }}\nVERSION_CODE=$((RUN_NUMBER * 100 + RUN_ATTEMPT))\nif [ \"$RUN_ATTEMPT\" = \"1\" ]; then\n  VERSION_NAME=\"1.0.$RUN_NUMBER\"\nelse\n  VERSION_NAME=\"1.0.$RUN_NUMBER.$RUN_ATTEMPT\"\nfi\necho \"version_code=$VERSION_CODE\" >> \"$GITHUB_OUTPUT\"\necho \"version_name=$VERSION_NAME\" >> \"$GITHUB_OUTPUT\"\necho \"tag=v$VERSION_NAME\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Build direct APKs (store=direct)
      env:
        SIGNING_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
        SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_ALIAS_PASSWORD: ${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}
        VERSION_CODE: ${{ steps.version.outputs.version_code }}
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
        APP_VERSION_CODE: ${{ github.run_number }}
      run: 'set -o pipefail

        ./gradlew  assembleRelease -Pstore=direct --stacktrace 2>&1 | tee -a /tmp/dsk-build.log

        mkdir -p dsk-apk


        cp "$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || ls app/build/outputs/apk/release/*.apk | head -1)" dsk-apk/JurySimulator-direct-release.apk

        ls -la dsk-apk

        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)

        $BT/apksigner verify --print-certs dsk-apk/JurySimulator-direct-release.apk | head -3 || true

        $BT/aapt2 dump badging dsk-apk/JurySimulator-direct-release.apk | head -3 || true

        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/JurySimulator-direct-release.apk ''classes*.dex'' | strings | grep -E "play\.google\.com/store|market://" | head || true

        '
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_JurySimulator_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/JurySimulator-direct-release.apk
