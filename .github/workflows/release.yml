name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          admob.app.id=${{ secrets.ADMOB_APP_ID }}
          admob.banner.id=${{ secrets.ADMOB_BANNER_ID }}
          admob.interstitial.id=${{ secrets.ADMOB_INTERSTITIAL_ID }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run lint + unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

  release:
    name: Build, sign, and publish release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          admob.app.id=${{ secrets.ADMOB_APP_ID }}
          admob.banner.id=${{ secrets.ADMOB_BANNER_ID }}
          admob.interstitial.id=${{ secrets.ADMOB_INTERSTITIAL_ID }}
          EOF

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty. Check SIGNING_KEY_BASE64 secret."
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          VERSION_CODE=$((${{ github.run_number }} + 100))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed AAB + APK
        env:
          SIGNING_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_ALIAS_PASSWORD: ${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Stage release artifacts
        id: artifacts
        run: |
          mkdir -p release-artifacts
          AAB_SRC=$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)
          APK_SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$AAB_SRC" ] || [ -z "$APK_SRC" ]; then
            echo "::error::Could not locate built AAB/APK"
            exit 1
          fi
          AAB_DEST="release-artifacts/jury-simulator-${{ steps.version.outputs.tag }}.aab"
          APK_DEST="release-artifacts/jury-simulator-${{ steps.version.outputs.tag }}.apk"
          cp "$AAB_SRC" "$AAB_DEST"
          cp "$APK_SRC" "$APK_DEST"
          echo "aab=$AAB_DEST" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_DEST" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jury Simulator ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
