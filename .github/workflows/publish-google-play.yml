name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to confirm a full production release (100% rollout, no draft)'
        required: true
        type: string
      release_notes:
        description: 'Release notes for this version (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_play_publish == 'publish' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          admob.app.id=${{ secrets.ADMOB_APP_ID }}
          admob.banner.id=${{ secrets.ADMOB_BANNER_ID }}
          admob.interstitial.id=${{ secrets.ADMOB_INTERSTITIAL_ID }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run lint + unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty. Check SIGNING_KEY_BASE64 secret."
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          # Timestamp-based, not github.run_number: this workflow's own run counter starts
          # at 1 and would undercut the versionCode already live on Play (1501, published
          # manually) — Play rejects any versionCode <= the live one.
          VERSION_CODE=$(date -u +'%y%j%H%M')
          VERSION_NAME="1.0.$(date -u +'%Y%m%d.%H%M')"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        env:
          SIGNING_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_ALIAS_PASSWORD: ${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Generate release notes
        run: |
          mkdir -p distribution/whatsnew
          NOTES_FILE="distribution/whatsnew/whatsnew-en-US"
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            printf '%s' "${{ github.event.inputs.release_notes }}" > "$NOTES_FILE"
          else
            echo "Bug fixes and performance improvements." > "$NOTES_FILE"
          fi

      - name: Verify Play service account
        run: |
          if [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi

      - name: Publish to Google Play Production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.jurysim
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true
